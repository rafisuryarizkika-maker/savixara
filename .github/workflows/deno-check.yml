name: Deno Isolated Check

on:
  push:
    branches:
      - audit/deno-lease-patch-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install project dependencies
        run: deno install --node-modules-dir=auto

      - name: Verify Deno runtime
        run: deno --version

      - name: Type-check lease tests
        run: deno check tests/lease-guard.test.ts

      - name: Type-check Melostore candidate
        run: deno check --no-check=remote supabase/functions/melostore-sync-pricelist-candidate/index.ts

      - name: Run lease guard tests
        run: deno test tests/lease-guard.test.ts

      - name: Type-check PostgreSQL concurrency test
        run: deno check tests/postgres-concurrency.test.ts

      - name: Run PostgreSQL concurrency test
        run: deno test tests/postgres-concurrency.test.ts
        
