
name: Deno Isolated Check

on:
  push:
    branches:
      - audit/deno-lease-patch-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install project dependencies
        run: deno install --node-modules-dir=auto

      - name: Verify Deno runtime
        run: deno --version

      - name: Type-check lease tests
        run: deno check tests/lease-guard.test.ts

        
      - name: Type-check auth gate tests
        run: deno check tests/auth-gate.test.ts

      - name: Run isolated auth gate tests
        run: deno test tests/auth-gate.test.ts

      - name: Type-check Melostore candidate
        run: deno check --no-check=remote supabase/functions/melostore-sync-pricelist-candidate/index.ts

      - name: Run lease guard tests
        run: deno test tests/lease-guard.test.ts

        
      - name: Type-check isolated HTTP auth tests
        run: deno check tests/melostore-http-auth.test.ts

      - name: Run isolated HTTP auth tests
        run: deno test tests/melostore-http-auth.test.ts 

      - name: Type-check PostgreSQL concurrency test
        run: deno check tests/postgres-concurrency.test.ts

      - name: Require PostgreSQL test database secret
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL secret is missing. Configure a dedicated test database URL before running PostgreSQL concurrency tests."
            exit 1
          fi

      - name: Run PostgreSQL concurrency test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: deno test --allow-env=TEST_DATABASE_URL,PG* --allow-net tests/postgres-concurrency.test.ts
        
      - name: Type-check real RPC idempotency test
        run: deno check tests/rpc-idempotency.test.ts

      - name: Run real RPC idempotency test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: deno test --allow-env=TEST_DATABASE_URL,PG* --allow-net tests/rpc-idempotency.test.ts

        
      - name: Type-check real RPC lease guard test
        run: deno check tests/rpc-lease-guard.test.ts

      - name: Run real RPC lease guard test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: deno test --allow-env=TEST_DATABASE_URL,PG* --allow-net tests/rpc-lease-guard.test.ts

        
      - name: Type-check real RPC catalog protection test
        run: deno check tests/rpc-catalog-protection.test.ts

      - name: Run real RPC catalog protection test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: deno test --allow-env=TEST_DATABASE_URL,PG* --allow-net tests/rpc-catalog-protection.test.ts
        
        
